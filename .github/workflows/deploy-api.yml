name: 🚀 Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔧 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 📥 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed to: $DEPLOY_URL"

      - name: 🗃️ Run Prisma Migrations (if schema changed)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "api/prisma/schema.prisma"; then
            echo "Prisma schema changed. Running migrations..."
            cd api
            npx prisma db push --skip-generate
          else
            echo "Prisma schema unchanged. Skipping migrations."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🩺 Health Check
        run: |
          HEALTH_URL="${{ steps.deploy.outputs.deploy_url }}/api/health"
          echo "Checking health at: $HEALTH_URL"
          curl --fail --retry 3 --retry-delay 5 "$HEALTH_URL" || echo "Health check warning: endpoint may need a few seconds to warm up."
